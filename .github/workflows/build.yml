name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Soroush.sln
      - name: Test
        run: dotnet test Soroush.sln --configuration Release --no-restore --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory "${{ runner.temp }}/coverage"
      - name: Verify diagnostics SDK sample
        run: dotnet run --project samples/Soroush.Diagnostics.Demo --configuration Release --no-restore -- --in-memory
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(dotnet msbuild src/Soroush.Mediator.Abstractions/Soroush.Mediator.Abstractions.csproj -getProperty:Version)
            echo "value=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        shell: bash
        run: |
          projects=(
            src/Soroush.Mediator.Abstractions/Soroush.Mediator.Abstractions.csproj
            src/Soroush.Mediator/Soroush.Mediator.csproj
            src/Soroush.Mediator.Analyzers/Soroush.Mediator.Analyzers.csproj
            src/Soroush.Mediator.Diagnostics/Soroush.Mediator.Diagnostics.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" --configuration Release --no-restore --output "$RUNNER_TEMP/packages" -p:Version="${{ steps.version.outputs.value }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages
      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: YasinSadjadi
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  observability:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: ephemeral-ci-validation
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate Compose
        run: docker compose -f observability/compose.yaml config --quiet
      - name: Validate Collector configuration
        run: docker run --rm -v "$PWD/observability/collector.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector-contrib:0.165.0 validate --config=/etc/otelcol/config.yaml
      - name: Validate and test alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/observability:/rules:ro" -w /rules prom/prometheus:v3.16.0 test rules alerts.test.yaml
      - name: Start local stack
        run: docker compose -f observability/compose.yaml up -d
      - name: Wait for readiness
        run: python3 observability/smoke.py
      - name: Export sample telemetry over OTLP
        run: dotnet run --project samples/Soroush.Diagnostics.Demo --configuration Release
      - name: Verify all three stored signals
        run: python3 observability/smoke.py --data
      - name: Capture service logs
        if: always()
        run: docker compose -f observability/compose.yaml logs --no-color
      - name: Stop local stack
        if: always()
        run: docker compose -f observability/compose.yaml down
