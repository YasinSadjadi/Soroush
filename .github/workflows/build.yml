name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Soroush.sln
      - name: Test
        run: dotnet test Soroush.sln --configuration Release --no-restore --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory "${{ runner.temp }}/coverage"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(dotnet msbuild src/Soroush.Mediator.Abstractions/Soroush.Mediator.Abstractions.csproj -getProperty:Version)
            echo "value=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-restore --output "$RUNNER_TEMP/packages" -p:Version="${{ steps.version.outputs.value }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "Set the NUGET_API_KEY repository secret before publishing." >&2
            exit 1
          fi
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
