extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(log.attributes, "Authorization")
          - delete_key(log.attributes, "authorization")
          - delete_key(log.attributes, "password")
          - delete_key(log.attributes, "access_token")
          - delete_key(log.attributes, "RequestPayload")
          - delete_key(log.attributes, "ResponsePayload")
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 5m
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 5m
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    translation_strategy: UnderscoreEscapingWithSuffixes
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
